!
version 15.2
service password-encryption
!
hostname CORE-RTR-01
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKz7Pd
!
aaa new-model
aaa authentication login default local
!
username admin secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKz7Pd
!
no ip http server
no ip https server
no ip domain-lookup
no ip source-route
no cdp run
!
interface GigabitEthernet0/0
 description UPLINK-TO-CORE
 ip address 10.10.1.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description MANAGEMENT
 ip address 10.10.2.2 255.255.255.0
 shutdown
!
ip access-list extended MGMT-IN
 permit tcp 10.10.10.0 0.0.0.255 10.10.2.0 0.0.0.255 eq 22 log
 deny tcp any any eq 23 log
 deny ip any any log
!
line con 0
 exec-timeout 10 0
!
line vty 0 4
 transport input ssh
 exec-timeout 10 0
 access-class MGMT-IN in
!
ntp server 10.10.50.1
logging host 10.10.50.5
logging buffered 16384
logging console informational
banner motd ^CUnauthorized access prohibited^C
!
end
