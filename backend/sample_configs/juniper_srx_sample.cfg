set system host-name SRX-EDGE-01
set system root-authentication encrypted-password "$9$abc"
set system login password policy minimum-length 12
set system login user netadmin authentication encrypted-password "$9$xyz"
set system services ssh idle-timeout 10
set system services ssh protocol-version v2
set system syslog host 10.20.30.10 any any
set system syslog file messages any any
set system ntp server 10.20.30.20
set system login message "Authorized personnel only"
set interfaces ge-0/0/0 description "WAN-UPLINK"
set interfaces ge-0/0/0 unit 0 family inet address 203.0.113.2/24
set interfaces ge-0/0/1 description "TRUST-LAN"
set interfaces ge-0/0/1 unit 0 family inet address 10.20.1.1/24
set interfaces ge-0/0/2 disable
set snmp community Str0ngStr1ng authorization read-only
set security zones security-zone trust interfaces ge-0/0/1
set security zones security-zone untrust interfaces ge-0/0/0
set security policies from-zone trust to-zone untrust policy ALLOW-WEB match source-address any
set security policies from-zone trust to-zone untrust policy ALLOW-WEB match destination-address any
set security policies from-zone trust to-zone untrust policy ALLOW-WEB match application junos-https
set security policies from-zone trust to-zone untrust policy ALLOW-WEB then permit log
set security policies from-zone untrust to-zone trust policy BLOCK-INBOUND match source-address any
set security policies from-zone untrust to-zone trust policy BLOCK-INBOUND match destination-address any
set security policies from-zone untrust to-zone trust policy BLOCK-INBOUND then deny log
set security policies default-policy deny-all
set routing-options static route 0.0.0.0/0 next-hop 203.0.113.1
set protocols lldp interface all
