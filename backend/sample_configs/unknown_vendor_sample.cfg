!
! NOVUS-OS v4.2 configuration -- synthetic vendor, NOT hardcoded in any parser
!
sysname EDGE-GW-07
!
management-policy MGMT
  protocol ssh admin-port 2222
  idle-timeout 9
  permitted-source 10.99.0.0 mask 255.255.255.0
!
service http-portal disable
service telnetd disable
service netbios-relay disable
!
local-userdb
  user netadmin role super hash $sha256$abcdef1234
  password-policy min-length 12 complexity on
!
firewall-policy INET-EDGE
  rule 10 action permit proto tcp src 10.99.0.0/24 dst 172.16.0.0/16 port 443
  rule 20 action deny proto any src any dst any notify-siem
  implicit default-deny
!
syslog remote 10.99.50.10 level warnings
time-sync ntp-server 10.99.50.20
login-notice banner "Authorized personnel only - NOVUS-OS"
snmp community Xy9#kL2$mQ read-only
!
port eth0
  address 10.99.1.1/24
  status enabled
!
port eth1
  address 172.16.1.1/16
  status disabled
!
commit
