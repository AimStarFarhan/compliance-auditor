services:
  # ─── Backend: FastAPI ───
  - type: web
    name: compliance-auditor-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6

  # ─── Frontend: static React build ───
  - type: web
    name: compliance-auditor
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      # URL of the backend API (change if Render assigns a different domain)
      - key: VITE_API_URL
        value: https://compliance-auditor-api.onrender.com
